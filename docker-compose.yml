services:
  db:
    image: postgres:15-alpine
    container_name: invensight-db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-Rocketman09}
      POSTGRES_DB: ${DB_NAME:-InvenSight}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backup.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-InvenSight}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: invensight-backend
    restart: always
    environment:
      - DATABASE_URL=postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-Rocketman09}@db:5432/${DB_NAME:-InvenSight}
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-InvenSight}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-Rocketman09}
      - ROOT_ADMIN_USERNAME=${ROOT_ADMIN_USERNAME:-rootadminnginamo}
      - ROOT_ADMIN_KEY=${ROOT_ADMIN_KEY:-changeit_now_123}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./server:/app
      - backend_uploads:/app/uploads

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=
    container_name: invensight-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  postgres_data:
  backend_uploads:
